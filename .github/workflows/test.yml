name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # peerDependencies (@mariozechner/*) are provided by pi at runtime;
      # a bare checkout has none, so ui.ts cannot resolve @mariozechner/pi-tui.
      # bun install pulls peer deps in by default.
      - run: bun install
      - run: bun test permission-gate statusline
